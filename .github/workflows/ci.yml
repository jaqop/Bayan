name: CI

on:
  push:
    branches: [main, bayan-plus]
  pull_request:
  workflow_dispatch:

# BAYAN-009: the token gets read access to the repository and nothing else.
# No job pushes, comments, or publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every third-party action is pinned to a full commit SHA (the tag it was
# taken from is in the trailing comment), so a moved or hijacked tag cannot
# change what runs here. Bump them deliberately: resolve the new tag to its
# commit and update both the SHA and the comment.

jobs:
  # Windows only, deliberately. Bayan is bound to the platform: ConPTY via
  # portable-pty, Shell_NotifyIcon toasts, RegisterHotKey, DX12-first wgpu,
  # and a windows-sys dependency. A Linux job would not compile, so there
  # isn't one — rather than a matrix full of exclusions.
  test:
    name: build + test (stable, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        # pinned by SHA, the action cannot read the toolchain from its ref
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --locked --all-targets
      # The real debug binary, before `cargo test` replaces the harness.
      # A dxcompiler.dll beside it must not be mapped by the time the
      # renderer is ready. The file is removed before the test step.
      - name: Planted dxcompiler.dll is not loaded
        shell: pwsh
        run: ./scripts/assert-no-planted-dxc.ps1 -BinaryPath target/debug/bayan.exe -PlantSource tests/fixtures/marker_dxcompiler.dll
      # Headless tests include isolated shell/PTY probes; no GUI or GPU.
      # Native signed-host round trips are explicitly run on a standard-token
      # Windows desktop: elevated runners deliberately reject that host.
      - name: Test
        run: cargo test --locked --all-targets
      - name: Count tests from the compiled harness
        shell: pwsh
        run: |
          $all = cargo test --locked --all-targets -- --list
          if ($LASTEXITCODE -ne 0) { throw 'Test enumeration failed' }
          $ignored = cargo test --locked --all-targets -- --list --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Ignored test enumeration failed' }
          $allCount = @($all | Where-Object { $_ -match ': test$' }).Count
          $ignoredCount = @($ignored | Where-Object { $_ -match ': test$' }).Count
          if ($allCount -le 0 -or $ignoredCount -gt $allCount) { throw 'Invalid test count' }
          "**$allCount tests**, with $ignoredCount ignored probes in the default run." >> $env:GITHUB_STEP_SUMMARY
      - name: Install and verify pinned Microsoft console host
        shell: pwsh
        run: |
          ./scripts/install-conpty.ps1 -OutputDirectory target/debug
          $env:BAYAN_SIGNED_HOST_DIR = (Resolve-Path target/debug).Path
          $artifacts = cargo test --locked --no-run --message-format=json | ForEach-Object { $_ | ConvertFrom-Json }
          if ($LASTEXITCODE -ne 0) { throw 'Test harness build failed' }
          $harness = @($artifacts | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.target.name -eq 'bayan' -and $_.executable })
          if ($harness.Count -ne 1) { throw 'Expected one Bayan test harness' }
          & $harness[0].executable --exact conpty_load::installed_microsoft_pair_is_verified_and_locked --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Pinned host verification failed' }
      - name: Record build identity
        shell: pwsh
        env:
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $files = @('bayan.exe', 'conpty.dll', 'OpenConsole.exe') | ForEach-Object {
            @{ name = $_; sha256 = (Get-FileHash -LiteralPath "target/debug/$_" -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ source_sha = $env:BUILD_SOURCE_SHA; checkout_sha = (git rev-parse HEAD); configuration = 'debug'; files = $files } | ConvertTo-Json -Depth 4 | Set-Content target/debug/build-identity.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        with:
          name: bayan-windows-tested
          if-no-files-found: error
          path: |
            target/debug/bayan.exe
            target/debug/conpty.dll
            target/debug/OpenConsole.exe
            target/debug/ConPTY-LICENSE.txt
            target/debug/build-identity.json

  # A slower reader or a heavier scrollback fails the pull request. The
  # probes are the ignored `measure_` tests in term.rs, in a release build;
  # scripts/perf_gate.py compares them with perf/baseline.json. Throughput is
  # gated as a share of the bare vte parser measured in the same run, so a
  # slow runner does not fail it. Three runs, best of each. Startup is the
  # time to the first frame and to a ready renderer, with a wide limit.
  perf:
    name: perf gate (reader, scrollback, startup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-probes
      - name: The gate's own tests
        run: python -m unittest scripts/test_perf_gate.py
      - name: Build the probes
        run: cargo test --locked --release --no-run
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            cargo test --locked --release -- --ignored measure_reader_throughput --nocapture --test-threads=1 2>&1 | tee -a probe.log
            cargo test --locked --release -- --ignored measure_scrollback_memory --nocapture --test-threads=1 2>&1 | tee -a probe.log
          done
      # Five starts of a release build with BAYAN_PROFILE, each stopped only
      # after all required marks arrive; files and PIDs belong to that run. The gate takes the fastest:
      # the first start of a job is cold (fonts, shader cache) and several
      # times slower. A hosted runner does open the window, on WARP.
      - name: Startup marks
        shell: pwsh
        run: |
          cargo build --locked --release --features dev-hooks
          if ($LASTEXITCODE -ne 0) { throw 'Startup probe build failed' }
          ./scripts/measure-startup.ps1 -BinaryPath target/release/bayan.exe -OutputPath startup.log
      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/perf_gate.py probe.log startup.log --print
          python scripts/perf_gate.py probe.log startup.log | tee -a "$GITHUB_STEP_SUMMARY"

  # Enforces the rust-version declared in Cargo.toml. That floor is set by the
  # dependency graph (cosmic-text 0.19 wants 1.89), not by our own source, so
  # without this job the declaration is a comment nobody checks.
  msrv:
    name: msrv 1.89
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check against the declared minimum
        run: cargo check --locked --all-targets

  # The tree is rustfmt-clean and clippy-clean with -D warnings, and these
  # two steps keep it that way. A lint the project disagrees with gets a
  # scoped #[allow] with a reason next to the code, not a quiet CI job.
  # The cost: a new stable clippy that adds a lint can turn this red without
  # a code change; fix or allow it then.
  lint:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # RustSec advisories against Cargo.lock. Fails on a known vulnerability;
  # unmaintained or yanked crates print as warnings and do not fail it. It
  # reads the lockfile and compiles nothing, so it is the one job that does
  # not need Windows. At the time of writing it reports one warning:
  # ttf-parser (via cosmic-text -> fontdb) is unmaintained upstream.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
