name: CI

on:
  push:
    branches: [main, bayan-plus]
  pull_request:
  workflow_dispatch:

# BAYAN-009: the token gets read access to the repository and nothing else.
# No job pushes, comments, or publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every third-party action is pinned to a full commit SHA (the tag it was
# taken from is in the trailing comment), so a moved or hijacked tag cannot
# change what runs here. Bump them deliberately: resolve the new tag to its
# commit and update both the SHA and the comment.

jobs:
  # Windows only, deliberately. Bayan is bound to the platform: ConPTY via
  # portable-pty, Shell_NotifyIcon toasts, RegisterHotKey, DX12-first wgpu,
  # and a windows-sys dependency. A Linux job would not compile, so there
  # isn't one — rather than a matrix full of exclusions.
  test:
    name: build + test (stable, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        # pinned by SHA, the action cannot read the toolchain from its ref
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --all-targets
      # The tests are pure unit tests — no GPU, no window, no PTY spawn —
      # so they run headless. They never read or write ~/.bayan, so a local
      # run with a live config.json behaves the same as this one.
      - name: Test
        run: cargo test --all-targets
      # The count used to be a sentence in CLAUDE.md that every pull request
      # edited by hand, so every pair of them conflicted on it and each
      # carried a different number. It is counted here instead.
      - name: Count the tests
        shell: bash
        run: |
          list=$(cargo test --all-targets -- --list --ignored 2>/dev/null | grep -c ': test$' || true)
          all=$(cargo test --all-targets -- --list 2>/dev/null | grep -c ': test$' || true)
          echo "tests: $all, of which $list are ignored probes"
          echo "**$all tests**, of which $list are \`#[ignore]\`d probes." >> "$GITHUB_STEP_SUMMARY"

  # A slower reader or a heavier scrollback fails the pull request. The
  # probes are the ignored `measure_` tests in term.rs, in a release build;
  # scripts/perf_gate.py compares them with perf/baseline.json. Throughput is
  # gated as a share of the bare vte parser measured in the same run, so a
  # slow runner does not fail it. Three runs, best of each. Startup time and
  # key-to-frame latency are not gated: they need a window.
  perf:
    name: perf gate (reader, scrollback)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-probes
      - name: The gate's own tests
        run: python -m unittest scripts/test_perf_gate.py
      - name: Build the probes
        run: cargo test --release --no-run
      - name: Measure
        shell: bash
        run: |
          for run in 1 2 3; do
            cargo test --release -- --ignored measure_reader_throughput --nocapture --test-threads=1 2>&1 | tee -a probe.log
            cargo test --release -- --ignored measure_scrollback_memory --nocapture --test-threads=1 2>&1 | tee -a probe.log
          done
      - name: Gate
        shell: bash
        run: |
          python scripts/perf_gate.py probe.log --print
          python scripts/perf_gate.py probe.log | tee -a "$GITHUB_STEP_SUMMARY"

  # Enforces the rust-version declared in Cargo.toml. That floor is set by the
  # dependency graph (cosmic-text 0.19 wants 1.89), not by our own source, so
  # without this job the declaration is a comment nobody checks.
  msrv:
    name: msrv 1.89
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check against the declared minimum
        run: cargo check --all-targets

  # The tree is rustfmt-clean and clippy-clean with -D warnings, and these
  # two steps keep it that way. A lint the project disagrees with gets a
  # scoped #[allow] with a reason next to the code, not a quiet CI job.
  # The cost: a new stable clippy that adds a lint can turn this red without
  # a code change; fix or allow it then.
  lint:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # RustSec advisories against Cargo.lock. Fails on a known vulnerability;
  # unmaintained or yanked crates print as warnings and do not fail it. It
  # reads the lockfile and compiles nothing, so it is the one job that does
  # not need Windows. At the time of writing it reports one warning:
  # ttf-parser (via cosmic-text -> fontdb) is unmaintained upstream.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
