[package]
name = "bayan"
version = "0.1.0"
edition = "2021"
# Set by the dependency graph, not by our own code: cosmic-text 0.19, smol_str
# and font-types all declare 1.89 (wgpu 30 wants 1.87). Our own floor is lower
# — is_multiple_of, from a clippy fix, needs 1.87.
rust-version = "1.89"
description = "Bayan (بيان) — an Arabic-first, agent-ready terminal emulator"
license = "MIT"

[dependencies]
# VT emulation: Alacritty's battle-tested core, published as a library
# 0.26.1-dev is the pre-release at the pinned commit below. A plain "0.26"
# requirement will not select a pre-release, so the patch would be ignored.
alacritty_terminal = "0.26.1-dev"
# ConPTY (Windows) / openpty (unix), extracted from WezTerm
portable-pty = "0.9"
# windowing + GPU present + text shaping (HarfBuzz-class, BiDi, fallback)
winit = "0.30"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
# system clipboard (copy on select / paste)
arboard = "3"
# OSC 52 payloads (programs setting the clipboard, e.g. yank over SSH)
base64 = "0.23"
# Kitty f=100 and iTerm2 inline images. PNG only: sixel has its own decoder,
# and raw RGB/RGBA never touches this crate. JPEG and the default image
# codecs stay out so the dependency stays on the png crate.
image = { version = "0.25", default-features = false, features = ["png"] }
# session persistence (~/.bayan/session.json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# config.lua and executable plugins. 0.12.2's rust-version is 1.88, so the
# 1.89 MSRV job can compile it. lua54+vendored builds Lua 5.4 with the
# platform C compiler (MSVC on Windows); LuaJIT is not used because its
# MSVC build is not the one upstream supports.
mlua = { version = "0.12.2", default-features = false, features = ["lua54", "vendored"] }
# Approval is the SHA-256 of the file bytes. A changed file is a new hash.
sha2 = "0.10"
# Hot-reload of ~/.bayan/config.json. On Windows the recommended backend
# is ReadDirectoryChangesW (a target dependency, not a crate feature).
# config_watch watches the parent directory so an editor that saves by
# renaming a temp file over config.json is seen, then debounces itself.
# notify 8.2.2 accepts notify-types ^2. 2.3.0 needs rustc 1.91, above
# this crate's 1.89 floor, so the lock stays on 2.2.0 (rustc 1.88).
notify = { version = "8.2.2", default-features = false }
notify-types = "=2.2.0"

# Screen readers (NVDA, JAWS, Narrator) via UI Automation. accesskit_winit's
# Windows backend is accesskit_windows; default features stay off so the
# Windows build does not pull the AT-SPI/unix adapter. The tree is built
# only after a client connects (`Adapter::update_if_active`).
accesskit = "0.25.2"
accesskit_winit = { version = "0.34.2", default-features = false, features = ["rwh_06"] }

[features]
# BAYAN_* environment debug hooks (BAYAN_TYPE, BAYAN_PASTE, BAYAN_PROFILE, …)
# are always on in debug builds and compiled out of release builds unless
# this feature is enabled: `cargo build --release --features dev-hooks`.
dev-hooks = []

# Win32, COM jump lists, and the handoff class factory. These crates do not
# build off Windows (`windows-future` and the rest of the windows bindings).
# The Windows target still links the same features as before.
[target."cfg(windows)".dependencies]
# global quake hotkey (RegisterHotKey + WM_HOTKEY via the msg hook);
# Diagnostics_Debug carries MessageBeep (the bell's "sound" mode)
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell", # Shell_NotifyIcon balloons = native toasts, no WinRT
    "Win32_Storage_FileSystem", # GetShortPathNameW: ConPTY chokes on spaces in paths
    "Win32_System_Com", # CoInitializeEx on the link-open thread, before ShellExecuteW
    "Win32_System_LibraryLoader", # SetDllDirectoryW; ConPTY comes from kernel32, not conpty.dll
    "Win32_System_ProcessStatus", # EnumProcessModules in the planted-conpty.dll test
    "Win32_System_Threading", # GetCurrentProcess for that module walk
    "Win32_Security", # TokenElevation: an elevated token does not run Lua
    "Win32_System_JobObjects", # spawn: kill child processes when the job closes
    "Win32_System_SystemInformation", # GetSystemDirectoryW: loaded kernel32 must sit under System32
    "Win32_System_IO", # DeviceIoControl: read a link's target without following it (localpath.rs)
    "Win32_System_Registry", # HKCU Explorer "Open Bayan here" (no HKLM); AppsUseLightTheme; TextScaleFactor
    "Win32_System_Console", # --help / --version attach to the parent console
    "Win32_System_Pipes", # mux server: CreateNamedPipeW / ConnectNamedPipe
    "Win32_Security", # TokenElevation; DACL on shell-integration temp files; the mux pipe DACL
    "Win32_Security_Authorization", # SDDL for those files (not world-writable, high integrity when elevated)
    "Win32_Graphics_Gdi", # GetSysColor: High Contrast system colors
    "Win32_UI_Accessibility", # HIGHCONTRASTW / HCF_HIGHCONTRASTON
] }

# Jump List (ICustomDestinationList) and the terminal-handoff class
# factory. windows-sys stays for the rest of the Win32 surface.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage", # PKEY_Title, PKEY_AppUserModel_ID
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common", # IObjectCollection for jump-list tasks
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# The `implement` macro emits `windows_core::` paths, so the crate has to
# be a direct dependency even though `windows` re-exports it.
windows-core = "0.61"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

# alacritty_terminal 0.26.0's push_keyboard_mode evicts from title_stack and
# panics at depth 4096. This commit fixes that removal to use the keyboard
# stack (alacritty#9071).
# TODO: remove the alacritty pin and go back to the crates.io release once
# alacritty_terminal 0.26.1 is published.
#
# cosmic-text 0.19.0 always passes None into BidiInfo, so the status bar
# cannot force a paragraph level. Direction::LeftToRight landed in 5631bfb
# (fix 4fe1195) and is not in a crates.io release. FontSystem::new is the
# same call; the on-disk font cache in that range is opt-in.
[patch.crates-io]
alacritty_terminal = { git = "https://github.com/alacritty/alacritty", rev = "542147067dd016fc5f49120ef0ba605a98a4e3a7" }
cosmic-text = { git = "https://github.com/pop-os/cosmic-text", rev = "4fe1195e6451d6aaa3dc383895d6fd366ea9fc7b" }
# portable-pty 0.9 loads conpty.dll by bare name. The vendored copy resolves
# CreatePseudoConsole / ResizePseudoConsole / ClosePseudoConsole from
# kernel32 via LoadLibraryExW(..., LOAD_LIBRARY_SEARCH_SYSTEM32).
portable-pty = { path = "vendor/portable-pty" }

[lints.clippy]
# every unsafe block carries a // SAFETY: comment; CI's -D warnings enforces it
undocumented_unsafe_blocks = "warn"
